# Probe for vfox-maven issue #8 on a macOS runner, run the way the reporter ran it: zsh,
# `vfox use -g`, then a new shell. The plugin is checked out at each matrix commit and
# repro/repro.sh does the rest. Nothing here is part of the plugin.
name: issue-8-repro

on:
  push:
    branches: [tmp/vfox-maven-8-macos-probe]

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.label }}, Maven ${{ matrix.version }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "93f802d (release 0.1.2, before #9)"
            ref: 93f802d45f8e8e3f21e4d23e12b5eb4df28fdb5b
            version: "3.10.1"
            stale: "3.9.16"
            partial: "3.10"
          - label: "93f802d (release 0.1.2, before #9)"
            ref: 93f802d45f8e8e3f21e4d23e12b5eb4df28fdb5b
            version: "3.6.3"
            stale: "3.6.2"
            partial: "3.6"
          - label: "9c54834 (#9)"
            ref: 9c54834d00a4f41704fc6ddb00cdddcbcc5931b6
            version: "3.10.1"
            stale: "3.9.16"
            partial: "3.10"
          - label: "9c54834 (#9)"
            ref: 9c54834d00a4f41704fc6ddb00cdddcbcc5931b6
            version: "3.6.3"
            stale: "3.6.2"
            partial: "3.6"
          - label: "5ca9f1b (latest main, #10)"
            ref: 5ca9f1b0f958f20e14343bbe64474da640f23250
            version: "3.10.1"
            stale: "3.9.16"
            partial: "3.10"
          - label: "5ca9f1b (latest main, #10)"
            ref: 5ca9f1b0f958f20e14343bbe64474da640f23250
            version: "3.6.3"
            stale: "3.6.2"
            partial: "3.6"
    env:
      VFOX_VERSION: "1.1.0"
      VFOX_ASSET: vfox_1.1.0_macos_aarch64.tar.gz
      # The checksum of the release asset, as listed in the release's checksums.txt.
      VFOX_SHA256: 9beb733ad636966c6d410c768407c63ffb350106eb23a8151d6fc80b9e84248e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: version-fox/vfox-maven
          ref: ${{ matrix.ref }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install vfox
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/${VFOX_ASSET}"
          echo "$VFOX_SHA256  $archive" | shasum -a 256 -c -
          bin_dir="$RUNNER_TEMP/vfox-bin"
          mkdir "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" --strip-components=1 "vfox_${VFOX_VERSION}_macos_aarch64/vfox"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Environment
        run: |
          sw_vers
          uname -m
          zsh --version
          vfox --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "mvn on PATH before the test: $(command -v mvn || echo none)"
      - name: Reproduce issue 8
        env:
          LABEL: ${{ matrix.label }}
          VERSION: ${{ matrix.version }}
          STALE: ${{ matrix.stale }}
          PARTIAL: ${{ matrix.partial }}
        run: |
          git -C plugin archive --format=zip -o "$RUNNER_TEMP/maven.zip" HEAD
          bash repro/repro.sh "$RUNNER_TEMP/maven.zip" "$LABEL" "$VERSION" "$STALE" "$PARTIAL"
